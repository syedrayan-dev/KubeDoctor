apiVersion: v1
kind: Pod
metadata:
  name: failed-crashloop-demo-pod
  namespace: apollo-demo
  labels:
    demo: apollo
spec:
  restartPolicy: Never
  containers:
  - name: failing-container
    image: busybox:1.35
    command: ["sh", "-c", "exit 1"]
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"