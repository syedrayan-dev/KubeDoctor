apiVersion: v1
kind: Pod
metadata:
  name: running-readiness-fail-demo-pod
  namespace: apollo-demo
  labels:
    demo: apollo
spec:
  restartPolicy: Always
  containers:
  - name: failing-container
    image: busybox:1.35
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    readinessProbe:
      exec:
        command: ["sh", "-c", "exit 1"]
      initialDelaySeconds: 5
      periodSeconds: 10
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"