{{- if .Values.webui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apollo.fullname" . }}-webui
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "apollo.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  replicas: {{ .Values.webui.replicaCount }}
  selector:
    matchLabels:
      {{- include "apollo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webui
  template:
    metadata:
      labels:
        {{- include "apollo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webui
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "apollo.serviceAccountName" . }}
      containers:
      - name: webui
        image: "{{ .Values.webui.image.repository }}:{{ .Values.webui.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.webui.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.webui.service.targetPort }}
          protocol: TCP
        livenessProbe:
          {{- toYaml .Values.webui.healthProbes.liveness | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.webui.healthProbes.readiness | nindent 10 }}
        resources:
          {{- toYaml .Values.webui.resources | nindent 10 }}
        env:
        - name: VITE_API_BASE_URL
          value: "/api"
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}