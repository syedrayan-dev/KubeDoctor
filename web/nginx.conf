# Apollo Web UI nginx configuration
# Serves the React SPA and proxies API requests to the Apollo operator

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Basic performance settings
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # Proxy /api requests to Apollo operator service
        # Frontend requests /api/v1/namespaces -> Backend http://apollo-api-service:8080/api/v1/namespaces
        location /api/ {
            proxy_pass http://apollo-api-service:8080/api/;
            
            # Forward client information to backend
            proxy_set_header Host apollo-api-service:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Serve React SPA static files
        # Supports client-side routing by falling back to index.html
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Error page handling
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}