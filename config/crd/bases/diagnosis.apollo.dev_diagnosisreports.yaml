---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: diagnosisreports.diagnosis.apollo.dev
spec:
  group: diagnosis.apollo.dev
  names:
    kind: DiagnosisReport
    listKind: DiagnosisReportList
    plural: diagnosisreports
    singular: diagnosisreport
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DiagnosisReport is the Schema for the diagnosisreports API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DiagnosisReportSpec defines the desired state of DiagnosisReport.
            properties:
              analysis:
                description: Analysis contains the LLM analysis results
                properties:
                  model:
                    description: Model is the LLM model used (e.g., "gpt-4")
                    type: string
                  processingTime:
                    description: ProcessingTime is how long the LLM analysis took
                    type: string
                  provider:
                    description: Provider is the LLM provider used (e.g., "openai")
                    type: string
                  recommendations:
                    description: Recommendations contains suggested solutions
                    items:
                      type: string
                    type: array
                  rootCause:
                    description: RootCause describes the identified root cause
                    type: string
                  summary:
                    description: Summary is a brief summary of the problem
                    type: string
                required:
                - model
                - processingTime
                - provider
                - recommendations
                - rootCause
                - summary
                type: object
              collectedData:
                description: CollectedData contains the raw data collected for diagnosis
                properties:
                  collectionTime:
                    description: CollectionTime is when the data was collected
                    format: date-time
                    type: string
                  logLines:
                    description: LogLines is the number of log lines collected
                    type: integer
                  logs:
                    description: Logs contains the recent pod logs
                    type: string
                  podDescription:
                    description: PodDescription contains the output of kubectl describe
                      pod
                    type: string
                required:
                - collectionTime
                - logLines
                - logs
                - podDescription
                type: object
              policyRef:
                description: PolicyRef references the DiagnosisPolicy that triggered
                  this diagnosis
                properties:
                  name:
                    description: Name of the DiagnosisPolicy
                    type: string
                  namespace:
                    description: Namespace of the DiagnosisPolicy
                    type: string
                required:
                - name
                - namespace
                type: object
              targetPod:
                description: TargetPod contains information about the diagnosed pod
                properties:
                  image:
                    description: Image contains the main container image information
                    type: string
                  name:
                    description: Name of the pod
                    type: string
                  namespace:
                    description: Namespace of the pod
                    type: string
                  uid:
                    description: UID of the pod for unique identification
                    type: string
                required:
                - image
                - name
                - namespace
                - uid
                type: object
              triggerCondition:
                description: TriggerCondition describes what condition triggered the
                  diagnosis
                properties:
                  detectedAt:
                    description: DetectedAt is when the condition was detected
                    format: date-time
                    type: string
                  type:
                    description: Type of the condition (e.g., "CrashLoopBackOff",
                      "ImagePullBackOff")
                    type: string
                required:
                - detectedAt
                - type
                type: object
            required:
            - analysis
            - collectedData
            - policyRef
            - targetPod
            - triggerCondition
            type: object
          status:
            description: DiagnosisReportStatus defines the observed state of DiagnosisReport.
            properties:
              completionTime:
                description: CompletionTime is when the diagnosis completed
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the diagnosis state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              error:
                description: Error contains error information if the diagnosis failed
                properties:
                  message:
                    description: Message is a human readable error message
                    type: string
                  reason:
                    description: Reason is a machine readable error reason
                    type: string
                  retryCount:
                    description: RetryCount is the number of retry attempts made
                    type: integer
                required:
                - message
                - reason
                type: object
              phase:
                description: Phase represents the current phase of the diagnosis
                enum:
                - Pending
                - InProgress
                - Completed
                - Failed
                type: string
              startTime:
                description: StartTime is when the diagnosis started
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
