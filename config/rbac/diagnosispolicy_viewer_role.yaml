# This rule is not used by the project apollo itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to diagnosis.apollo.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: apollo
    app.kubernetes.io/managed-by: kustomize
  name: diagnosispolicy-viewer-role
rules:
- apiGroups:
  - diagnosis.apollo.dev
  resources:
  - diagnosispolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - diagnosis.apollo.dev
  resources:
  - diagnosispolicies/status
  verbs:
  - get
