# This rule is not used by the project apollo itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over diagnosis.apollo.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: apollo
    app.kubernetes.io/managed-by: kustomize
  name: diagnosispolicy-admin-role
rules:
- apiGroups:
  - diagnosis.apollo.dev
  resources:
  - diagnosispolicies
  verbs:
  - '*'
- apiGroups:
  - diagnosis.apollo.dev
  resources:
  - diagnosispolicies/status
  verbs:
  - get
